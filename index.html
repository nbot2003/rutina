<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi rutina — 4 días, fuerza y pérdida de grasa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E8EBEF; --surface:#FFFFFF; --surface-2:#F3F5F7; --ink:#171E27; --muted:#5B6673; --line:#D3D9E0;
  --accent:#1E4FD6; --accent-ink:#FFFFFF; --accent-soft:#E4EAFB;
  --up:#136B42; --up-bg:#DFF3E8; --hold:#7A5300; --hold-bg:#FBEFD2; --down:#A3261B; --down-bg:#FBE1DD;
  --shadow:0 1px 2px rgba(23,30,39,.06);
  --r:14px; --nav-h:62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141B; --surface:#1A212B; --surface-2:#222B36; --ink:#EDF1F5; --muted:#9AA6B4; --line:#2E3946;
    --accent:#6B93FF; --accent-ink:#0B1222; --accent-soft:#1E2B4A;
    --up:#5BCB95; --up-bg:#15321F; --hold:#E6B85C; --hold-bg:#3A2D0E; --down:#F58A7B; --down-bg:#421B16;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#1A212B; --surface-2:#222B36; --ink:#EDF1F5; --muted:#9AA6B4; --line:#2E3946;
  --accent:#6B93FF; --accent-ink:#0B1222; --accent-soft:#1E2B4A;
  --up:#5BCB95; --up-bg:#15321F; --hold:#E6B85C; --hold-bg:#3A2D0E; --down:#F58A7B; --down-bg:#421B16;
  --shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));
}
h1,h2,h3{font-family:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;font-weight:700;margin:0;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input[type=number]{width:110px}
a{color:var(--accent)}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{font-size:30px;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:14px;margin-top:2px}
.week{text-align:right;font-size:13px;color:var(--muted);line-height:1.3;flex-shrink:0}
.week b{display:block;font-family:"Barlow Semi Condensed",sans-serif;font-size:22px;color:var(--ink);font-weight:700}

/* day notes */
.note{background:var(--surface-2);border-left:4px solid var(--line);padding:10px 12px;border-radius:8px;margin:14px 0;font-size:14px;color:var(--muted)}
.note b{color:var(--ink);font-weight:600}

/* exercise card */
.ex{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);margin:12px 0;overflow:hidden}
.ex-head{display:grid;grid-template-columns:72px 1fr auto;gap:12px;padding:12px 14px 12px 12px;width:100%;text-align:left;align-items:start}
.pic{width:72px;height:72px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.pic svg{width:66px;height:66px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ex-name{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:21px;line-height:1.1}
.ex-meta{font-size:13.5px;color:var(--muted);margin-top:3px}
.ex-last{font-size:14px;margin-top:6px;color:var(--ink)}
.ex-last .dim{color:var(--muted)}
.num{font-family:"Barlow Semi Condensed",sans-serif;font-size:14px;color:var(--muted);padding-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 10px;border-radius:999px;font-weight:600;font-size:14px;line-height:1}
.pill.up{background:var(--up-bg);color:var(--up)} .pill.hold{background:var(--hold-bg);color:var(--hold)}
.pill.down{background:var(--down-bg);color:var(--down)} .pill.start{background:var(--accent-soft);color:var(--accent)}
.pill.reset{background:var(--down-bg);color:var(--down)}
.pill .kg{font-family:"Barlow Semi Condensed",sans-serif;font-size:18px;font-weight:700;white-space:nowrap}
.ex-body{display:none;border-top:1px solid var(--line);padding:12px 14px 16px}
.ex.open .ex-body{display:block}
.tech{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px}
.tech h3{font-size:15px;margin-bottom:4px;font-weight:700}
.tech ul{margin:0;padding-left:16px}
.tech li{margin:3px 0}
@media (max-width:420px){.tech{grid-template-columns:1fr}}

/* log form */
.form{margin-top:14px;background:var(--surface-2);border-radius:12px;padding:12px}
.form h3{font-size:16px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.row label{font-size:14px;color:var(--muted);min-width:96px}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:8px 0}
.set{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 6px}
.set span.l{font-size:13px;color:var(--muted);padding-left:4px}
.set .v{font-family:"Barlow Semi Condensed",sans-serif;font-size:22px;font-weight:700;min-width:28px;text-align:center}
.set button{width:36px;height:36px;border-radius:8px;background:var(--surface-2);font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{min-width:44px;height:40px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:9px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.saved{color:var(--up);font-weight:600;font-size:14px}
.rule{font-size:13px;color:var(--muted);margin-top:8px}

/* history */
.hist{margin-top:14px}
.hist h3{font-size:15px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.hist table{width:100%;border-collapse:collapse;font-size:14px}
.hist td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.hist td.k{font-family:"Barlow Semi Condensed",sans-serif;font-size:17px;font-weight:700;white-space:nowrap}
.hist td.d{color:var(--muted);white-space:nowrap}
.hist td.del{text-align:right}
.hist td.del button{color:var(--muted);font-size:13px;padding:2px 6px}
.spark{height:40px;width:100%;display:block;margin:4px 0 8px}
.spark path{fill:none;stroke:var(--accent);stroke-width:2}
.spark circle{fill:var(--accent)}

/* progress tab */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.card h2{font-size:22px;margin-bottom:8px}
.card h3{font-size:16px;margin:12px 0 6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:var(--surface-2);border-radius:10px;padding:10px}
.stat b{display:block;font-family:"Barlow Semi Condensed",sans-serif;font-size:24px;font-weight:700;line-height:1}
.stat span{font-size:12.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;margin:6px 0 4px}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .lbl{font-size:11px;fill:var(--muted);font-family:"Barlow",sans-serif}
.chart .dots circle{fill:var(--muted);opacity:.45}
.chart .avg path{fill:none;stroke:var(--accent);stroke-width:2.5}
.chart .avg circle{fill:var(--accent)}
.chart .avg text{font-size:11px;fill:var(--ink);font-weight:600;font-family:"Barlow",sans-serif}
table.plain{width:100%;border-collapse:collapse;font-size:14px}
table.plain th{text-align:left;font-weight:600;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line);font-size:13px}
table.plain td{padding:6px 4px;border-bottom:1px solid var(--line)}
table.plain td.n{font-family:"Barlow Semi Condensed",sans-serif;font-size:17px;font-weight:700}
.delta.up{color:var(--up)} .delta.down{color:var(--down)}
.twrap{overflow-x:auto}

.swap{background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.swap-btns{display:flex;flex-wrap:wrap;gap:6px}
/* guide tab */
.guide p{margin:6px 0}
.guide ul,.guide ol{margin:6px 0;padding-left:18px}
.guide li{margin:4px 0}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nav button{height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:12px;font-weight:500}
.nav button b{font-family:"Barlow Semi Condensed",sans-serif;font-size:17px;font-weight:700;line-height:1}
.nav button.on{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}

/* rest timer */
.timer{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:6;display:none}
.timer.on{display:block}
.timer .in{max-width:680px;margin:0 auto 8px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:12px;margin-left:14px;margin-right:14px}
.timer .t{font-family:"Barlow Semi Condensed",sans-serif;font-size:30px;font-weight:700;min-width:80px}
.timer .t.done{color:#5BCB95}
.timer span.l{flex:1;font-size:14px;opacity:.85}
.timer button{background:rgba(255,255,255,.15);color:inherit;border-radius:8px;padding:6px 10px;font-weight:600;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 70px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;font-weight:600;z-index:7;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.store{font-size:12.5px;color:var(--muted);text-align:center;margin:18px 0 4px}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.hidden{display:none !important}
</style>
</head>

<div class="toast" id="toast"></div>
<nav class="nav"><div class="in" id="nav"></div></nav>

const $=s=>document.querySelector(s);
const z=n=>String(n).padStart(2,'0');

const fn=n=>(Math.round(n*100)/100).toString().replace('.',',');

/* ---------- Estado y almacenamiento ---------- */
const S={ex:{},body:{start:'',w:{},c:{},subs:{}}};
const LS_KEY='rutina4d_v1';
let store={kind:'local'};
let writeQ=Promise.resolve();
function lsLoad(){try{const r=localStorage.getItem(LS_KEY);if(r){const o=JSON.parse(r);if(o&&o.ex)S.ex=o.ex;if(o&&o.body)S.body=Object.assign({start:'',w:{},c:{},subs:{}},o.body);}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS_KEY,JSON.stringify({ex:S.ex,body:S.body}));}catch(e){}}
function persistEx(id){lsSave();if(store.kind!=='db')return;const data={entries:S.ex[id]||[]};
  writeQ=writeQ.then(()=>store.root.collection('ex').doc(id).set(data)).catch(e=>{toast('Guardado solo en este navegador');});}
function persistBody(){lsSave();if(store.kind!=='db')return;const data=JSON.parse(JSON.stringify(S.body));
  writeQ=writeQ.then(()=>store.root.set(data)).catch(e=>{toast('Guardado solo en este navegador');});}

async function initDb(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    const root=db.doc('data/users/'+uid+'/profile');
    store={kind:'db',db,root};
    let first=true;
    root.collection('ex').onSnapshot(snap=>{
      if(first){first=false;
        if(snap.empty&&Object.keys(S.ex).some(k=>(S.ex[k]||[]).length)){Object.keys(S.ex).forEach(k=>persistEx(k));persistBody();toast('Datos copiados a tu cuenta');}
      }
      let changed=false;
      snap.docs.forEach(doc=>{const e=(doc.data()||{}).entries||[];if(JSON.stringify(e)!==JSON.stringify(S.ex[doc.id]||[])){S.ex[doc.id]=e;changed=true;}});
      if(changed){lsSave();render();}
      updateStoreLine();
    },err=>{store={kind:'local'};updateStoreLine();});
    root.onSnapshot(snap=>{
      if(!snap.exists)return;const b=snap.data()||{};
      const nb={start:b.start||'',w:b.w||{},c:b.c||{},subs:b.subs||{}};
      if(JSON.stringify(nb)!==JSON.stringify(S.body)){S.body=nb;lsSave();render();}
    });
    updateStoreLine();
  }catch(e){}
}
function updateStoreLine(){document.querySelectorAll('.store-line').forEach(e=>{e.textContent=store.kind==='db'?'Guardado en tu cuenta de Claude: lo verás desde cualquier dispositivo.':'Guardado en este navegador y dispositivo. Haz un respaldo cada cierto tiempo (Peso → Copiar respaldo) por si cambias de celular o borras datos del navegador.';});}

/* ---------- Semana y fase ---------- */
function startDate(){if(S.body.start)return S.body.start;let m=null;Object.values(S.ex).forEach(a=>a.forEach(e=>{if(!m||e.d<m)m=e.d;}));return m||today();}
function weekNo(){const diff=Math.floor((parse(today())-parse(startDate()))/864e5);return Math.max(1,Math.floor(diff/7)+1);}
function phase(w){if(w<=2)return 'RIR 3 · tanteo y técnica';if(w<=4)return 'RIR 2 · doble progresión';if(w<=7)return 'RIR 2 · última serie RIR 1 en ej. 1–2';if(w===8)return 'Descarga · 2 series · RIR 4';return 'Bloque terminado: planifica el siguiente';}

/* ---------- Decisión de carga ---------- */
function decide(ex,entries){
  if(!entries||!entries.length)return{kind:'start',w:null,text:'Tantea el peso hoy'};
  const last=entries[entries.length-1];const sum=a=>a.reduce((x,y)=>x+y,0);
  if(weekNo()===8)return{kind:'hold',w:last.w,text:ex.timed?'Descarga: 2 series':'Descarga: 2 series, RIR 4'};
  if(ex.timed){const ok=last.r.every(s=>s>=ex.target);return ok?{kind:'up',w:null,text:'Suma 5–10 s por serie'}:{kind:'hold',w:null,text:'Repite; llega a '+ex.target+' s'};}
  const all6=last.r.every(x=>x>=6),anyLow=last.r.some(x=>x<4);const sg=ex.inverse?-1:1;const step=ex.half||ex.inc;
  if(ex.bw){if(all6&&last.rir>=1)return{kind:'up',w:null,text:'Añade lastre o haz la variante más difícil'};return{kind:'hold',w:null,text:anyLow?'Repite':'Repite y suma repeticiones'};}
  if(all6&&last.rir>=1)return{kind:'up',w:Math.max(0,roundTo(last.w+ex.inc*sg,step)),text:ex.inverse?'baja la asistencia':'sube'};
  if(all6&&last.rir===0)return{kind:'hold',w:last.w,text:'repite con RIR 2 (fuiste al fallo)'};
  if(anyLow)return{kind:'down',w:Math.max(0,roundTo(last.w-step*sg,step)),text:ex.inverse?'sube la asistencia':'vuelve'};
  if(entries.length>=3){const a=entries.slice(-3);if(a.every(e=>e.w===last.w)){const t=a.map(e=>sum(e.r));if(t[2]<=t[1]&&t[1]<=t[0])return{kind:'reset',w:roundTo(last.w*0.92,step),text:'3 sesiones sin avanzar: baja ~8 % y vuelve a subir'};}}
  return{kind:'hold',w:last.w,text:'repite y suma repeticiones'};
}

function swapBar(ex){

  if(ex.isAlt)h+='<button class="btn ghost small" data-sub="'+base.id+'">'+esc(base.name)+'</button>';

function saveSession(ex){
  const f=F[ex.id];let w=0;
  if($('#w-'+ex.id)){const inp=$('#w-'+ex.id);w=parseFloat(String(inp.value).replace(',','.'));if(isNaN(w)||w<0){toast('Escribe el peso');inp.focus();return;}}

  persistEx(ex.id);delete F[ex.id];render();

function hist(ex,en){
  if(!en.length)return '<div class="hist"><h3>Historial</h3><div class="rule">Tu primera sesión aparecerá aquí con la decisión para la siguiente.</div></div>';
  const last=en.slice(-10);let sp='';
  if(!ex.timed&&last.length>1){const ws=last.map(e=>e.w);const mn=Math.min(...ws),mx=Math.max(...ws);const W=300,H=40;const px=i=>8+i*(W-16)/(last.length-1);const py=v=>mx===mn?H/2:H-6-(v-mn)*(H-12)/(mx-mn);
    sp='<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><path d="'+ws.map((v,i)=>(i?'L':'M')+px(i)+' '+py(v)).join(' ')+'"/>'+ws.map((v,i)=>'<circle cx="'+px(i)+'" cy="'+py(v)+'" r="3"/>').join('')+'</svg>';}
  const rows=en.slice().reverse().slice(0,8).map(e=>'<tr><td class="d">'+fdate(e.d)+'</td><td class="k">'+(ex.timed?(ex.wt?fkg(e.w)+' · ':'')+e.r.join('-')+' s':ex.bw?e.r.join('-'):fkg(e.w))+'</td><td>'+(ex.timed?'':(ex.bw?'':e.r.join('-')+' · ')+'RIR '+e.rir)+(e.n?'<div class="rule" style="margin-top:2px">'+esc(e.n)+'</div>':'')+'</td><td class="del"><button data-del="'+e.d+'">borrar</button></td></tr>').join('');
  return '<div class="hist"><h3>Historial <span class="rule" style="margin:0">'+en.length+' sesión'+(en.length===1?'':'es')+'</span></h3>'+sp+'<table>'+rows+'</table></div>';
}

/* ---------- Temporizador de descanso ---------- */
let T={left:0,iv:null,ctx:null};
function beep(){try{if(!T.ctx)T.ctx=new (window.AudioContext||window.webkitAudioContext)();const c=T.ctx;const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.12;o.start();o.stop(c.currentTime+.35);}catch(e){}}
function startRest(sec,label){T.left=sec;$('#timer').classList.add('on');$('#timer-l').textContent='Descanso · '+label;$('#timer-t').classList.remove('done');tick();clearInterval(T.iv);T.iv=setInterval(()=>{T.left--;tick();if(T.left<=0){clearInterval(T.iv);$('#timer-t').classList.add('done');$('#timer-l').textContent='Siguiente serie';beep();if(navigator.vibrate)navigator.vibrate([200,100,200]);}},1000);try{if(!T.ctx)T.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function tick(){$('#timer-t').textContent=mmss(Math.max(0,T.left));}
$('#timer-plus').onclick=()=>{T.left+=30;$('#timer-t').classList.remove('done');tick();if(!T.iv||T.left===30){clearInterval(T.iv);T.iv=setInterval(()=>{T.left--;tick();if(T.left<=0){clearInterval(T.iv);$('#timer-t').classList.add('done');beep();if(navigator.vibrate)navigator.vibrate([200,100,200]);}},1000);}};
$('#timer-stop').onclick=()=>{clearInterval(T.iv);T.iv=null;$('#timer').classList.remove('on');};

/* ---------- Progreso ---------- */
function weeks(){const w=S.body.w;const g={};Object.keys(w).forEach(d=>{const k=mondayOf(d);(g[k]=g[k]||[]).push(w[d]);});
  return Object.keys(g).sort().map(k=>{const a=g[k];const avg=a.reduce((x,y)=>x+y,0)/a.length;const e=parse(k);e.setDate(e.getDate()+6);return{k,label:fdate(k)+' – '+fdate(ymd(e)),avg,n:a.length};});}
function weightChart(){
  const keys=Object.keys(S.body.w).sort();if(keys.length<2)return '';
  const W=340,H=170,L=34,R=10,Tp=14,B=24;const t0=parse(keys[0]).getTime(),t1=parse(keys[keys.length-1]).getTime();const span=Math.max(t1-t0,864e5*6);
  const vals=keys.map(k=>S.body.w[k]);const wk=weeks();const all=vals.concat(wk.map(x=>x.avg));let mn=Math.min(...all)-0.7,mx=Math.max(...all)+0.7;
  const px=t=>L+(t-t0)/span*(W-L-R);const py=v=>Tp+(mx-v)/(mx-mn)*(H-Tp-B);
  let h='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Peso diario y promedio semanal">';
  const ticks=[mn+0.7,(mn+mx)/2,mx-0.7];ticks.forEach(v=>{h+='<line class="axis" x1="'+L+'" x2="'+(W-R)+'" y1="'+py(v)+'" y2="'+py(v)+'"/><text class="lbl" x="'+(L-4)+'" y="'+(py(v)+4)+'" text-anchor="end">'+fn(Math.round(v*10)/10)+'</text>';});
  h+='<g class="dots">'+keys.map(k=>'<circle cx="'+px(parse(k).getTime())+'" cy="'+py(S.body.w[k])+'" r="2.5"/>').join('')+'</g>';
  const pts=wk.map(x=>{const m=parse(x.k);m.setDate(m.getDate()+3);return{x:Math.min(W-R,Math.max(L,px(m.getTime()))),y:py(x.avg),v:x.avg};});
  h+='<g class="avg"><path d="'+pts.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ')+'"/>'+pts.map(p=>'<circle cx="'+p.x+'" cy="'+p.y+'" r="4"/><text x="'+p.x+'" y="'+(p.y-8)+'" text-anchor="middle">'+fn(Math.round(p.v*10)/10)+'</text>').join('')+'</g>';
  h+='<text class="lbl" x="'+L+'" y="'+(H-6)+'">'+fdate(keys[0])+'</text><text class="lbl" x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+fdate(keys[keys.length-1])+'</text></svg>';
  return h+'<div class="rule">Puntos: peso diario. Línea: promedio de cada semana (lunes a domingo). Compara promedios, no días.</div>';
}

/* ---------- Guía ---------- */
function renderGuide(){
  $('#main').innerHTML='<div class="card guide"><h2>Cómo decidir el peso</h2>'+
  '<p><b>Primera semana:</b> una serie fácil de 8, sube y haz 5, sube y haz 3. Cuando 6 repeticiones se sientan como "podría hacer 9" (RIR 3), ese es tu peso de trabajo.</p>'+
  '<p><b>Cada sesión:</b> mismo peso en todas las series. La app te dice la siguiente carga según lo que registraste:</p>'+
  '<ul><li><b>Sube</b> si cerraste 6 en todas las series con RIR ≥ 1 y la técnica igual de la 1.ª a la 6.ª.</li><li><b>Repite</b> si alguna serie quedó entre 4 y 5: busca sumar repeticiones.</li><li><b>Vuelve</b> al peso anterior (o medio salto) si alguna serie bajó de 4.</li><li><b>Reinicio</b> si llevas 3 sesiones sin sumar repeticiones: baja ~8 % y vuelve a subir en 2–3 semanas. Antes revisa sueño y comida.</li></ul>'+
  '<h3>RIR: repeticiones en reserva</h3><table class="plain"><tr><th>RIR</th><th>Sensación</th></tr><tr><td class="n">4+</td><td>muy fácil; aproximación y semana 1</td></tr><tr><td class="n">3</td><td>podías 3 más; semanas 1–2 y primera serie siempre</td></tr><tr><td class="n">2</td><td>podías 2 más, la velocidad baja; objetivo estándar</td></tr><tr><td class="n">1</td><td>solo una más; última serie de ej. 1–2, semanas 5–7</td></tr><tr><td class="n">0</td><td>fallo: nunca en esta rutina</td></tr></table>'+
  '<h3>La serie termina cuando</h3><ul><li>llegas a 6, o al RIR objetivo;</li><li>la técnica cambia: la barra se desvía, la cadera sube antes que el pecho, un codo se abre, aparece impulso. Eso cuenta como RIR 0.</li></ul>'+
  '<h3>Cuánto subir</h3><table class="plain"><tr><th>Ejercicio</th><th>Salto</th><th>Medio</th></tr><tr><td>Sentadilla, rumano, hip thrust</td><td class="n">5 kg</td><td>2,5</td></tr><tr><td>Prensa</td><td class="n">10 kg</td><td>5</td></tr><tr><td>Banca, militar</td><td class="n">2,5 kg</td><td>1,25</td></tr><tr><td>Mancuernas</td><td class="n">siguiente par</td><td>una serie primero</td></tr><tr><td>Máquinas y poleas</td><td class="n">una placa</td><td>media placa</td></tr><tr><td>Laterales, curls, tríceps</td><td class="n">1–2,5 kg</td><td>suma 1 s a la bajada</td></tr></table>'+
  '<h3>Cardio y pasos</h3><ul><li>Caminadora 25–30 min después de las pesas, a ritmo de conversación (118–138 pulsaciones), inclinación 3–5 %.</li><li>HIIT opcional desde la semana 5, en bici, una vez por semana: el sábado después de pierna o el jueves como sesión suelta. Nunca martes ni viernes (al día siguiente toca pierna). 5 min suave, 6 × (30 s duros / 90 s suaves), 4 min suave.</li><li>Pasos: tu promedio actual + 1 000 por semana hasta 10 000.</li><li>Si la sentadilla o la prensa caen dos sesiones seguidas, recorta primero el cardio, no las series.</li></ul>'+
  '<h3>Comida, en una línea</h3><p>Unas 2 200–2 300 kcal y 160–180 g de proteína al día, repartida en 4 comidas de 35–45 g. Ajusta cada 2–3 semanas según el promedio de peso.</p>'+
  '<h3>Para y consulta si</h3><p>Dolor agudo o punzante en una articulación, dolor de espalda que baja por la pierna, mareo, dolor en el pecho. Las agujetas del día siguiente son normales; el dolor durante el ejercicio no.</p>'+
  '<p class="rule">La guía completa, con la técnica detallada, el plan de cardio y la alimentación, está en <a href="https://claude.ai/code/artifact/1795ee40-a1c0-4f26-b639-fba4a4ac5b7d">tu documento</a>. Los dibujos son esquemas para recordar la posición, no fotos de técnica.</p></div>';
